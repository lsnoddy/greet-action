name: Test the action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Run the action from this commit
        id: greet
        uses: ./
        with:
          who: Tester

      - name: Check the output
        shell: bash
        env:
          GREETING: ${{ steps.greet.outputs.greeting }}
        run: |
          if [ "$GREETING" != "Hello, Tester!" ]; then
            echo "::error title=Wrong output::Expected 'Hello, Tester!' but got '$GREETING'"
            exit 1
          fi
          echo "Output is correct: $GREETING"
